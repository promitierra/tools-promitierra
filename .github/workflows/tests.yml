name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv
        
    - name: Install dependencies
      run: |
        uv pip install -r requirements.txt
        uv pip install pytest pytest-cov
        
    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=src/ --cov-report=xml -m "not performance"
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  performance:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv
        
    - name: Install dependencies
      run: |
        uv pip install -r requirements.txt
        uv pip install pytest pytest-cov psutil
        
    - name: Run performance tests
      run: |
        pytest tests/ -v -m "performance" --no-cov
        
    - name: Generate performance report
      if: success() || failure()
      run: |
        python -c "
        import json
        import glob
        import os
        
        # Recopilar resultados de pruebas de rendimiento
        results = {
            'test_results': [],
            'summary': {
                'total_tests': 0,
                'passed_tests': 0,
                'failed_tests': 0
            }
        }
        
        # Analizar archivos de resultados
        for file in glob.glob('.pytest_cache/v/cache/nodeids'):
            with open(file) as f:
                tests = [line for line in f.readlines() if 'test_performance' in line]
                results['test_results'].extend(tests)
                results['summary']['total_tests'] = len(tests)
        
        # Guardar reporte
        with open('performance_report.json', 'w') as f:
            json.dump(results, f, indent=2)
        "
        
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-report
        path: performance_report.json 