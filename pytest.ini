[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configuración de cobertura
addopts = 
    --cov=src
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --verbose
    -ra
    --strict-markers

# Marcadores personalizados
markers =
    integration: marca pruebas de integración
    slow: marca pruebas que toman más tiempo
    gui: marca pruebas que requieren interfaz gráfica
    performance: marca pruebas de rendimiento y benchmarking

# Configuración de logging
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S 